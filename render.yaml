# Render declarative service configuration for the Schedule Assistant.
#
# Deploy with:  render.yaml is read automatically when you "New +" a Web Service
# in the Render dashboard and point it at this repo, or run:
#   render deploy --service schedule-assistant
services:
  - type: web
    name: schedule-assistant
    region: oregon
    runtime: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    startCommand: uvicorn src.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pin a modern Python; sentence-transformers is excluded for >=3.14 and
      # the app falls back to the deterministic offline embedding model.
      - key: PYTHON_VERSION
        value: "3.14"
      - key: SCHEDULE_RETRIEVER_K
        value: "8"
      # Add Google/OpenAI keys in the Render dashboard (Secrets) when you want
      # LLM-powered responses. Leave unset for the offline fallback.
      - key: GOOGLE_API_KEY
        value: ""
